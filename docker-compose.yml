services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: crucible
      POSTGRES_PASSWORD: crucible_dev_only
      POSTGRES_DB: crucible
    ports: ["127.0.0.1:5433:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U crucible"]
      interval: 3s
      retries: 10
  sandbox:
    build: .
    command: uv run uvicorn crucible.sandbox.app:app --host 0.0.0.0 --port 8000 --reload
    environment:
      DATABASE_URL: postgresql+psycopg://crucible:crucible_dev_only@db:5432/crucible
    ports: ["127.0.0.1:8000:8000"]
    depends_on:
      db: { condition: service_healthy }
    volumes:
      - ./src:/app/src
volumes:
  pgdata:
