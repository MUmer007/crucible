id: sample-refund-scenario
version_note: "v1"
description: "Basic refund scenario with a ghost success fault"
tags: ["reliability", "refunds"]
seed: 1001
runs: 1
task: "Refund charge ch_1001 for 4999 cents"
seed_data: "fixtures/payments_basic.yaml"
agent_timeout_s: 60
faults:
  - id: f_ghost
    match:
      method: POST
      path: /payments/refunds
    on_call: [1]
    type: commit_then_timeout
    params:
      delay_ms: 100
attacks: []
task_success:
  invariant: refund_exactly_once
  params:
    charge_id: ch_1001
    amount_cents: 4999
invariants:
  - name: refund_exactly_once
    params:
      charge_id: ch_1001
      amount_cents: 4999
  - name: no_over_refund
    params: {}
budget:
  max_requests: 30
  max_seconds: 60
