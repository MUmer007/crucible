[project]
name = "crucible"
version = "0.1.0"
description = "Crucible: AI Agent Evaluation Sandbox"
readme = "README.md"
authors = [
    { name = "Muhammad Umer", email = "muhammmadumer50@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "aiofiles>=25.1.0",
    "alembic>=1.13.0",
    "fastapi>=0.110.0",
    "httpx>=0.27.0",
    "jinja2>=3.1.3",
    "psycopg[binary]>=3.1.18",
    "pydantic>=2.6.0",
    "pyyaml>=6.0.1",
    "sqlalchemy[asyncio]>=2.0.28",
    "typer>=0.9.0",
    "uvicorn>=0.28.0",
]


[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "hypothesis>=6.100.0",
    "mypy>=1.9.0",
    "pyright>=1.1.414",
    "pytest>=8.1.0",
    "pytest-asyncio>=0.23.5",
    "ruff>=0.3.0",
    "types-pyyaml>=6.0.12",
]

[tool.pytest.ini_options]
filterwarnings = [
    "ignore:.*WindowsSelectorEventLoopPolicy.*:DeprecationWarning",
    "ignore:.*set_event_loop_policy.*:DeprecationWarning",
]
asyncio_mode = "auto"
testpaths = ["tests"]

[project.scripts]
crucible = "crucible.cli:main"


[tool.pyright]
typeCheckingMode = "basic"
reportArgumentType = "none"
reportAttributeAccessIssue = "none"
reportGeneralTypeIssues = "none"
reportOptionalMemberAccess = "none"
reportOperatorIssue = "none"
reportReturnType = "none"
reportCallIssue = "none"
